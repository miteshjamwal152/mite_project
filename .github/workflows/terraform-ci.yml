name: "Terraform CI Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Deprecation warning log suppress karne ke liye
env:
  ACTIONS_ALLOW_USE_UNSECURED_NODE20: "true"

jobs:
  terraform-ci:
    name: "Terraform Init & Validate"
    runs-on: ubuntu-latest

    steps:
      # 1. Latest Checkout Action
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      # 2. Azure Login (Agar Azure authentication use kar rahe hain)
      # - name: Azure Login
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. HashiCorp Setup Terraform (Updated patch version)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.7.0"

      # 4. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -backend=false

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate