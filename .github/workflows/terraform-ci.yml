name: "Terraform CI Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURED_NODE20: "true"

jobs:
  terraform-ci:
    name: "Terraform Init, Validate & Plan"
    runs-on: ubuntu-latest

    steps:
      # 1. Latest Checkout Action
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      # 2. Azure Login (Uncommented and Active)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.7.0"

      # 4. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check

      # 5. Terraform Init (Azure backend/login ke sath init karne ke liye)
      - name: Terraform Init
        run: terraform init

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan (New Added Step)
      - name: Terraform Plan
        run: terraform plan